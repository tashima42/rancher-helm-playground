---
name: Generate chart data
description: >-
  Builds the playground's chart data from the helm repositories listed in a
  config file, by running the published chart-data image. Only versions the
  ledger has never seen are downloaded, so a scheduled run costs one index.yaml
  fetch per repository.

inputs:
  config:
    description: Repository config to read.
    required: false
    default: docs/data/repos.yaml
  out-dir:
    description: Directory to write the generated data to.
    required: false
    default: docs/data/v1
  full-refresh:
    description: Ignore the ledger and rebuild every version.
    required: false
    default: 'false'
  retry-missing:
    description: Look again for versions recorded as no longer hosted.
    required: false
    default: 'false'
  max-new:
    description: Stop after this many downloads, so a first run can be split up. 0 means no limit.
    required: false
    default: '0'
  jobs:
    description: Parallel chart downloads.
    required: false
    default: '8'
  image:
    description: Generator image to run.
    required: false
    default: ghcr.io/tashima42/rancher-helm-playground/chart-data:latest
  registry-token:
    description: >-
      Token to read the image with. Only needed while the package is private;
      pass secrets.GITHUB_TOKEN from a job with packages:read.
    required: false
    default: ''

outputs:
  changed:
    description: 'true when the generated data differs from what is committed.'
    value: ${{ steps.generate.outputs.changed }}
  versions:
    description: Number of chart versions in the ledger after the run.
    value: ${{ steps.generate.outputs.versions }}

runs:
  using: composite
  steps:
    - name: Log in to the registry
      if: inputs.registry-token != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TOKEN: ${{ inputs.registry-token }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        registry="${IMAGE%%/*}"
        printf '%s' "$TOKEN" | docker login "$registry" --username "$ACTOR" --password-stdin

    - name: Pull the generator
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: docker pull --quiet "$IMAGE"

    - name: Generate
      id: generate
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONFIG: ${{ inputs.config }}
        OUT_DIR: ${{ inputs.out-dir }}
        FULL_REFRESH: ${{ inputs.full-refresh }}
        RETRY_MISSING: ${{ inputs.retry-missing }}
        MAX_NEW: ${{ inputs.max-new }}
        JOBS: ${{ inputs.jobs }}
      run: |
        set -euo pipefail

        args=(--config "$CONFIG" --out "$OUT_DIR" --max-new "$MAX_NEW" --jobs "$JOBS")
        [ "$FULL_REFRESH" = "true" ] && args+=(--full-refresh)
        [ "$RETRY_MISSING" = "true" ] && args+=(--retry-missing)

        # As the runner's own user, so the generated files belong to whoever
        # commits them rather than to root.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --volume "$PWD:/work" \
          --workdir /work \
          "$IMAGE" "${args[@]}"

        versions=$(jq '.entries | length' "$OUT_DIR/state.json")
        echo "versions=$versions" >> "$GITHUB_OUTPUT"

        if [ -n "$(git status --porcelain -- "$OUT_DIR")" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

        {
          echo "### Chart data"
          echo
          echo "- versions in the ledger: \`$versions\`"
          echo "- payloads: \`$(find "$OUT_DIR/charts" -name '*.json' | wc -l | tr -d ' ')\`"
        } >> "$GITHUB_STEP_SUMMARY"

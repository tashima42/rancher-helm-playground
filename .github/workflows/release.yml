---
name: Release

# Cutting a tag publishes the chart-data image under that exact tag:
#
#   git tag v1.2.0 && git push origin v1.2.0   ->   chart-data:v1.2.0
#
# Nothing else is published, so an image tag always names one build.
on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the tagged image
    runs-on: ubuntu-latest
    permissions:
      contents: read # reads the Dockerfile and the generator source
      packages: write # pushes the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Registry paths are lowercase; a repository name need not be.
          name="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/chart-data"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # Exactly the tag that was pushed and nothing else: no floating
          # major, minor or latest tag ever moves underneath a consumer.
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=chart-data
            org.opencontainers.image.description=Generates the Rancher Helm Playground chart data

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/chart-data
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

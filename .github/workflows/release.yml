---
name: Release

# Cutting a tag publishes the chart-data image under that exact tag:
#
#   git tag v1.2.0 && git push origin v1.2.0   ->   chart-data:v1.2.0
#
# Nothing else is published, so an image tag always names one build. The image
# is built through the Makefile, so what CI publishes is what `make image`
# builds on a laptop.
on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the tagged image
    runs-on: ubuntu-latest
    permissions:
      contents: read # reads the Dockerfile and the generator source
      packages: write # pushes the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Registry paths are lowercase; a repository name need not be.
          name="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/chart-data"
          echo "name=$name:$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: make image-push

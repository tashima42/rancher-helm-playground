---
name: Update chart data

# Refreshes docs/data/v1 from the chart repositories. Versions already in the
# ledger are never downloaded again, so the daily run is cheap.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      full-refresh:
        description: Ignore the ledger and rebuild every version.
        type: boolean
        required: false
        default: false
      retry-missing:
        description: Look again for versions recorded as no longer hosted.
        type: boolean
        required: false
        default: false
      max-new:
        description: Stop after this many downloads (0 means no limit).
        type: number
        required: false
        default: 0
  # Callable from another workflow, in this repository or any other.
  workflow_call:
    inputs:
      full-refresh:
        description: Ignore the ledger and rebuild every version.
        type: boolean
        required: false
        default: false
      retry-missing:
        description: Look again for versions recorded as no longer hosted.
        type: boolean
        required: false
        default: false
      max-new:
        description: Stop after this many downloads (0 means no limit).
        type: number
        required: false
        default: 0
      config:
        description: Repository config to read.
        type: string
        required: false
        default: docs/data/repos.yaml
      out-dir:
        description: Directory to write the generated data to.
        type: string
        required: false
        default: docs/data/v1

permissions:
  contents: read

concurrency:
  group: update-chart-data
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the chart data
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the refreshed data back to the branch
      packages: read # reads the generator image from ghcr.io
    steps:
      # No credentials are left in .git/config; the commit step authenticates
      # its push on its own, so nothing else in the job can reach the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate chart data
        id: data
        uses: $/.github/actions/chart-data
        with:
          config: ${{ inputs.config || 'docs/data/repos.yaml' }}
          out-dir: ${{ inputs.out-dir || 'docs/data/v1' }}
          full-refresh: ${{ inputs.full-refresh && 'true' || 'false' }}
          retry-missing: ${{ inputs.retry-missing && 'true' || 'false' }}
          max-new: ${{ inputs.max-new || 0 }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        if: steps.data.outputs.changed == 'true'
        env:
          OUT_DIR: ${{ inputs.out-dir || 'docs/data/v1' }}
          VERSIONS: ${{ steps.data.outputs.versions }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT_DIR"
          git commit -m "chore: refresh chart data ($VERSIONS versions)"
          # The checkout persisted no credentials, so the push carries its own.
          remote="https://x-access-token:$TOKEN@github.com/$REPOSITORY"
          git push "$remote" "HEAD:$BRANCH" || {
            git pull --rebase origin "$BRANCH"
            git push "$remote" "HEAD:$BRANCH"
          }
